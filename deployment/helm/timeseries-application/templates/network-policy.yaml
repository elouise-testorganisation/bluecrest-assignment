{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bluecrest.fullname" . }}-default-deny-ingress
  labels:
    {{- include "bluecrest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bluecrest.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bluecrest.fullname" . }}-allow-ingress-controller
  labels:
    {{- include "bluecrest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bluecrest.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8501
{{- end }}
{{- end }}
