replicaCount: 1
image:
  repository: ghcr.io/elouise-matthews/bluecrest-assignment/dev
  tag: "dev-latest"
  pullPolicy: Always
imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: bluecrest
fullnameOverride: ""
service:
  type: ClusterIP
  port: 8501
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: bluecrest.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
data:
  configMapName: bluecrest-data
  fileName: data.csv
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
