replicaCount: 1

image:
  repository: ghcr.io/elouise-matthews/bluecrest-assignment/prod
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8501

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

data:
  # Supply a CSV on the cluster as a ConfigMap named bluecrest-data, key data.csv.
  # The chart mounts it read-only at /app/data.csv.
  configMapName: bluecrest-data
  fileName: data.csv

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
