name: Build image

# 1. Resolve ref: Identify the exact commit SHA to build. Take note if isMain. 
# 2. Checkout sha. 
# 3. Set up Docker: Configure QEMU and Buildx for multi-architecture builds.
# 4. Log in to GHCR
# 5. Set image tags: Main builds use production version tags and latest; other builds use the short commit SHA.
# 6. Build and push: Build amd64 and arm64 images and push them to GHCR.
# 7. Publish check: Report buildPassed against the exact commit SHA.
# 8. Fail on errors

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  build:
    if: inputs.ref != '' || github.event_name != 'pull_request' || github.event.label.name == 'buildImage'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref to commit SHA
        id: target
        uses: actions/github-script@v7
        env:
          INPUT_REF: ${{ inputs.ref }}
          CALLER_IS_MAIN: ${{ github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        with:
          script: |
            let ref = process.env.INPUT_REF;
            if (context.eventName === 'pull_request') {
              ref = context.payload.pull_request.head.sha;
            }
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref
            });
            const isMain = context.eventName === 'pull_request'
              ? false
              : ref === 'main' || ref === 'refs/heads/main'
                || process.env.CALLER_IS_MAIN === 'true';
            core.setOutput('sha', commit.data.sha);
            core.setOutput('isMain', String(isMain));
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define image tags
        id: meta
        shell: bash
        env:
          REF_SHA: ${{ steps.target.outputs.sha }}
          IS_MAIN: ${{ steps.target.outputs.isMain }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          SHORT_SHA="${REF_SHA:0:7}"
          if [[ "$IS_MAIN" == "true" ]]; then
            VERSION="$(git describe --tags --exact-match "${REF_SHA}" 2>/dev/null || true)"
            VERSION="${VERSION#v}"
            if [[ -z "$VERSION" ]]; then VERSION="$(grep -E '^version\s*=' src/app/pyproject.toml | head -1 | cut -d '"' -f2)"; fi
            echo "image=${IMAGE}/prod" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}/prod:${VERSION},${IMAGE}/prod:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=${IMAGE}/dev" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}/dev:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push multi-architecture image
        id: image_build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ./src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Publish buildPassed check on tested commit
        if: always() && steps.target.outputs.sha != ''
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ steps.image_build.outcome }}
          TESTED_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'buildPassed',
              head_sha: process.env.TESTED_SHA,
              status: 'completed',
              conclusion: process.env.BUILD_RESULT === 'success' ? 'success' : 'failure',
              output: { title: 'Container image build', summary: process.env.BUILD_RESULT === 'success' ? 'Multi-architecture image built and pushed to GHCR.' : 'Image build or push failed. See this workflow run for details.' }
            });
      - name: Fail workflow when image build fails
        if: steps.image_build.outcome != 'success'
        run: exit 1
