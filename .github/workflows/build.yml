name: Build image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      branch:
        description: Branch name associated with the image ref
        required: false
        type: string
      skip_label_gate:
        description: Skip the PR-label gate when invoked by the deploy orchestrator
        required: false
        type: boolean
        default: false
      ref:
        description: Branch, tag, or SHA to build
        required: false
        type: string
        default: main
  pull_request:
    types: [labeled, synchronize, reopened]
    branches-ignore: [main]

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  build:
    if: inputs.skip_label_gate || github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'buildImage') && (github.event.action != 'synchronize' && github.event.action != 'reopened' || contains(github.event.pull_request.labels.*.name, 'buildImage'))
    runs-on: ubuntu-latest
    steps:
      - name: Select image ref
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.ref }}" ]]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            if [[ -n "${{ inputs.branch }}" ]]; then echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"; else echo "branch=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"; fi
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define image tags
        id: meta
        shell: bash
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          REF_SHA: ${{ steps.target.outputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          SHORT_SHA="$(git rev-parse --short "${REF_SHA}")"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "refs/heads/main" ]]; then
            VERSION="$(git describe --tags --exact-match "${REF_SHA}" 2>/dev/null || true)"
            VERSION="${VERSION#v}"
            if [[ -z "$VERSION" ]]; then VERSION="$(grep -E '^version\s*=' src/app/pyproject.toml | head -1 | cut -d '"' -f2)"; fi
            echo "image=${IMAGE}/prod" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}/prod:${VERSION},${IMAGE}/prod:latest" >> "$GITHUB_OUTPUT"
          else
            SAFE_BRANCH="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g' | sed -E 's/^-+|-+$//g')"
            echo "image=${IMAGE}/dev" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}/dev:${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push image
        id: image_build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Publish buildPassed check on tested commit
        if: always() && steps.target.outputs.ref != ''
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ steps.image_build.outcome }}
          TESTED_REF: ${{ steps.target.outputs.ref }}
          TESTED_BRANCH: ${{ steps.target.outputs.branch }}
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const branch = process.env.TESTED_BRANCH;
            const sha = isPR ? context.payload.pull_request.head.sha : process.env.TESTED_REF;
            const mainRef = branch === 'main' || branch === 'refs/heads/main';
            if (isPR && !mainRef) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'buildPassed',
                head_sha: sha,
                status: 'completed',
                conclusion: process.env.BUILD_RESULT === 'success' ? 'success' : 'failure',
                output: { title: 'Container image build', summary: process.env.BUILD_RESULT === 'success' ? 'Image built and pushed to GHCR.' : 'Image build or push failed. See this workflow run for details.' }
              });
            } else {
              core.info('Main/manual build run: no buildPassed check run is posted.');
            }
      - name: Fail workflow when image build fails
        if: steps.image_build.outcome != 'success'
        run: exit 1
