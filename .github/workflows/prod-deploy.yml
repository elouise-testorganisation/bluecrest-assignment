name: Production deploy

# 1. Select ref: Use the pushed commit SHA or require main for manual deployments.
# 2. Run the tests workflow against that ref.
# 3. Build and publish the application image and timeseries-application Helm chart to GHCR.
# 4. Checkout the selected ref on the deployment runner; set up Helm and kubectl.
# 5. Verify Minikube access, the production namespace and the GHCR pull secret.
# 6. Apply the production data ConfigMap.
# 7. Determine the application image version and published Helm chart version.
# 8. Pull the published chart from GHCR and deploy it with values-prod.yaml.
# 9. Verify the Kubernetes rollout and HTTP health endpoint.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to deploy (production deployments must use main)
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_REF" != "main" && "$INPUT_REF" != "refs/heads/main" ]]; then echo "Production deployment is only allowed from main." >&2; exit 1; fi
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: select
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.select.outputs.ref }}
    secrets: inherit

  build:
    needs: [select, tests]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.select.outputs.ref }}
    secrets: inherit

  deploy:
    needs: [select, tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.ref }}
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Approval gate
        run: |
          echo "Could wait for approval?"
      - name: Verify Minikube access and prerequisites
        run: |
          echo "Would have checked Minikube access, the production namespace, and the GHCR pull secret"
          # Original commands retained for later re-enabling:
