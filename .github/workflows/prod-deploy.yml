name: Production deploy

# 1. Select ref: Use the pushed commit or require main for manual deployments.
# 2. Run tests: Call the tests pipeline.
# 3. Build image: Call the build pipeline.
# 4. Checkout: Get the selected code on the deployment runner.
# 5. Verify prerequisites: Check Minikube access, production namespace and pull secret.
# 6. Apply data: Create the production data ConfigMap.
# 7. Determine version: Use the matching Git tag, or fall back to the version in pyproject.toml.
# 8. Deploy: Install the Helm release into bluecrest-prod using that image version.
# 9. Verify: Check rollout status and the HTTP health endpoint.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to deploy (production deployments must use main)
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_REF" != "main" && "$INPUT_REF" != "refs/heads/main" ]]; then echo "Production deployment is only allowed from main." >&2; exit 1; fi
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: select
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.select.outputs.ref }}
    secrets: inherit

  build:
    needs: [select, tests]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.select.outputs.ref }}
    secrets: inherit

  deploy:
    needs: [select, tests, build]
    runs-on: [self-hosted, linux, minikube]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.ref }}
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Verify Minikube access and prerequisites
        run: |
          kubectl config current-context
          kubectl get namespace bluecrest-prod
          kubectl get secret ghcr-pull-secret --namespace bluecrest-prod
      - name: Apply production data ConfigMap
        run: |
          kubectl create configmap bluecrest-data \
            --from-file=data.csv=src/data/data.csv \
            --namespace bluecrest-prod --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy production Helm release
        id: helm
        env:
          DEPLOY_REF: ${{ needs.select.outputs.ref }}
        run: |
          VERSION="$(git describe --tags --exact-match "$DEPLOY_REF" 2>/dev/null || true)"
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(grep -E '^version\s*=' src/app/pyproject.toml | head -1 | cut -d '"' -f2)"
          fi
          echo "Deploying prod image version $VERSION"
          helm upgrade --install timeseries-application deployment/helm/timeseries-application \
            --namespace bluecrest-prod \
            --values deployment/helm/timeseries-application/values-prod.yaml \
            --set image.tag="$VERSION" \
            --wait --timeout 180s
      - name: Verify rollout and HTTP health endpoint
        run: |
          kubectl rollout status deployment/bluecrest --namespace bluecrest-prod --timeout=180s
          (kubectl port-forward service/bluecrest 18501:8501 --namespace bluecrest-prod >/tmp/bluecrest-port-forward.log 2>&1 & echo $! >/tmp/bluecrest-port-forward.pid)
          trap 'kill "$(cat /tmp/bluecrest-port-forward.pid)" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18501/_stcore/health', timeout=2)" 2>/dev/null; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/bluecrest-port-forward.log
          echo "Production health check failed." >&2
          exit 1
