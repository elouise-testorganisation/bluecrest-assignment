name: Tests

# 1. Select ref: choose the commit to test.
# 2. Checkout: get the selected code.
# 3. Record SHA: identify the exact commit.
# 4. Set up Python 3.12.
# 5. Install dependencies from src/app/requirements.txt.
# 6. Run tests from src with PYTHONPATH set to the src directory.
# 7. Publish the testsPassed check on the commit.
# 8. Fail the workflow if tests fail.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read
  checks: write

jobs:
  tests:
    if: inputs.ref != '' || github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'runTests')
    runs-on: ubuntu-latest
    steps:
      - name: Select tested ref
        id: target
        env:
          INPUT_REF: ${{ inputs.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - name: Resolve tested commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/app/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r src/app/requirements.txt
      - name: Run complete test suite
        id: suite
        continue-on-error: true
        working-directory: src
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s test -v
      - name: Publish testsPassed check on tested commit
        if: always() && steps.commit.outputs.sha != ''
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ steps.suite.outcome }}
          TESTED_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'testsPassed',
              head_sha: process.env.TESTED_SHA,
              status: 'completed',
              conclusion: process.env.TEST_RESULT === 'success' ? 'success' : 'failure',
              output: { title: 'Test suite', summary: process.env.TEST_RESULT === 'success' ? 'All tests passed.' : 'The test suite failed. See this workflow run for details.' }
            });
      - name: Fail workflow when tests fail
        if: steps.suite.outcome != 'success'
        run: exit 1

  helm-validation:
    name: Helm lint and template validation
    if: inputs.ref != '' || github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'runTests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint default chart values
        run: helm lint deployment/helm/timeseries-application
      - name: Lint development values
        run: helm lint deployment/helm/timeseries-application -f deployment/helm/timeseries-application/values-dev.yaml
      - name: Lint production values
        run: helm lint deployment/helm/timeseries-application -f deployment/helm/timeseries-application/values-prod.yaml
      - name: Render default manifests
        run: helm template bluecrest deployment/helm/timeseries-application --namespace bluecrest-dev
      - name: Render development manifests
        run: helm template bluecrest deployment/helm/timeseries-application --namespace bluecrest-dev -f deployment/helm/timeseries-application/values-dev.yaml
      - name: Render production manifests
        run: helm template bluecrest deployment/helm/timeseries-application --namespace bluecrest-prod -f deployment/helm/timeseries-application/values-prod.yaml
