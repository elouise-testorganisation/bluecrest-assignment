name: Tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to test
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      skip_label_gate:
        description: Skip the PR-label gate when invoked by the deploy orchestrator
        required: false
        type: boolean
        default: false
      ref:
        description: Branch, tag, or SHA to test
        required: false
        type: string
        default: main
  pull_request:
    types: [labeled, synchronize, reopened]
    branches-ignore: [main]

permissions:
  contents: read
  checks: write

jobs:
  tests:
    if: inputs.skip_label_gate || github.event_name != 'pull_request' || (github.event.action != 'labeled' || github.event.label.name == 'runTests') && (github.event.action != 'synchronize' && github.event.action != 'reopened' || contains(github.event.pull_request.labels.*.name, 'runTests'))
    runs-on: ubuntu-latest
    steps:
      - name: Select tested ref
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.ref }}" ]]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Run complete test suite
        id: suite
        continue-on-error: true
        working-directory: src
        run: python -m unittest discover -v
      - name: Publish testsPassed check on tested commit
        if: always() && steps.target.outputs.ref != ''
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ steps.suite.outcome }}
          TESTED_REF: ${{ steps.target.outputs.ref }}
          TESTED_BRANCH: ${{ steps.target.outputs.branch }}
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const branch = process.env.TESTED_BRANCH;
            const sha = isPR ? context.payload.pull_request.head.sha : process.env.TESTED_REF;
            const mainRef = branch === 'main' || branch === 'refs/heads/main';
            if (isPR && !mainRef) {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'testsPassed',
                head_sha: sha,
                status: 'completed',
                conclusion: process.env.TEST_RESULT === 'success' ? 'success' : 'failure',
                output: { title: 'Test suite', summary: process.env.TEST_RESULT === 'success' ? 'All tests passed.' : 'The test suite failed. See this workflow run for details.' }
              });
            } else {
              core.info('Main/manual test run: no testsPassed check run is posted.');
            }
      - name: Fail workflow when tests fail
        if: steps.suite.outcome != 'success'
        run: exit 1
