name: Development deploy

# 1. Select ref: Use the PR head SHA or manually specified ref; reject main.
# 2. Run the tests workflow against that ref.
# 3. Build and publish the application image and matching timeseries-application Helm chart to GHCR.
# 4. Checkout the selected ref on the deployment runner; set up Helm and kubectl.
# 5. Create a unique temporary Kubernetes namespace.
# 6. Configure GHCR image-pull credentials in that namespace.
# 7. Apply the development data ConfigMap.
# 8. Pull the published SHA-versioned chart from GHCR and deploy it with values-dev.yaml.
# 9. Verify the Kubernetes rollout and HTTP health endpoint.
# 10. Wait 10 minutes, then delete the temporary namespace.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to deploy
        required: true
        type: string
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  select:
    if: github.event_name != 'pull_request' || github.event.label.name == 'deployDev'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            if [[ "$INPUT_REF" == "main" || "$INPUT_REF" == "refs/heads/main" ]]; then echo "Dev deploy requires a non-main ref." >&2; exit 1; fi
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: select
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.select.outputs.ref }}
    secrets: inherit

  build:
    needs: [select, tests]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.select.outputs.ref }}
    secrets: inherit

  deploy:
    needs: [select, tests, build]
    # Run the simulation even if tests/build fail; no cluster access is used.
    if: always() && needs.select.result == 'success'
    # Original real-deployment runner retained for later re-enabling:
    # runs-on: [self-hosted, linux, minikube]
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.namespace.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.ref }}
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Create unique transient namespace
        id: namespace
        shell: bash
        run: |
          NS="bluecrest-dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$NS" >> "$GITHUB_OUTPUT"
          echo "created transient namespace $NS (simulated; Kubernetes namespace creation skipped)"
